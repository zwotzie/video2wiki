[project]
name = "video2wiki"
version = "0.1.0"
description = "Download YouTube videos, transcribe with Whisper, summarize with OpenAI, save as Markdown wiki"
requires-python = ">=3.13"
dependencies = [
    "yt-dlp>=2024",
    "openai>=1.0",
    "faster-whisper>=1.0",
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
video2wiki = "video2wiki.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video2wiki"]

[tool.uv]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.15.1",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.format]
quote-style = "double"
